:root {

* { margin:0; padding:0; box-sizing:border-box; }
body {

}
.sub {

  font-size: 0.78rem;

}
.wrap { width:100%; max-width:1200px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
svg { display:block; width:100%; height:auto; }
.leg { display:flex; flex-wrap:wrap; gap:16px 28px; justify-content:center;
       margin-top:24px; font-size:0.75rem; font-family:'DM Mono',monospace; color:var(--muted); }
.leg span { display:flex; align-items:center; gap:6px; }
.leg i { display:inline-block; width:14px; height:14px; border-radius:3px; }
@keyframes dash { to { stroke-dashoffset: -24; } }
.conn { stroke-dasharray: 8 5; animation: dash 1.8s linear infinite; }
.tip {
  position:fixed; background:#1e2230; border:1px solid #3a3f50; border-radius:8px;
  padding:10px 14px; font-family:'DM Mono',monospace; font-size:0.75rem; color:#c0c6d4;
  pointer-events:none; opacity:0; transition:opacity .18s; z-index:100;
  max-width:300px; line-height:1.55; box-shadow:0 8px 30px rgba(0,0,0,.55);
}
.tip.show { opacity:1; }
</style>

<h1>Deep Interest Evolution Network</h1>
<p class="sub">
  DIEN 使用 GRU 提取用户兴趣序列隐状态，通过注意力机制与 AUGRU 建模兴趣随候选目标的动态演化过程，用于 CTR 预估。
</p>

<!-- ═══════ AUXILIARY LOSS ═══════ -->

<g class="nd" data-tip="辅助损失 (Auxiliary Loss):&#10;帮助 GRU 学习更有意义的兴趣隐状态。&#10;&#10;原理: 用下一步真实行为 e_{i+1} 作为正样本，&#10;随机采样物品 e_j⁻ 作为负样本。&#10;&#10;L_aux = -1/(T-1) Σ [log σ(h_i · e_{i+1})&#10;         + Σ_j log(1 - σ(h_i · e_j⁻))]&#10;&#10;使隐状态能预测用户的下一步行为。">

<text x="900" y="368" text-anchor="middle" fill="#cc3050" font-size="9" font-family="DM Mono,monospace" opacity=".7">pos: σ(h_i · e_{i+1})  |  neg: σ(h_i · e_j⁻)</text>
</g>

<text x="900" y="400" text-anchor="middle" fill="#ff4d6a" font-size="10" font-weight="600" font-family="DM Mono,monospace">L_aux</text>
<text x="900" y="418" text-anchor="middle" fill="#cc3050" font-size="8.5" font-family="DM Mono,monospace" opacity=".6">added to main loss: L = L_main + α · L_aux</text>

<!-- ═══════ ATTENTION MECHANISM ═══════ -->

<g class="nd" data-tip="注意力权重计算:&#10;使用目标物品 Embedding 作为 Query，&#10;与每个兴趣隐状态 h_t 计算注意力分数。&#10;&#10;α_t = softmax(score(h_t, e_target))&#10;&#10;score 可以是内积、双线性变换或 MLP。&#10;α_t 越大 → 该时刻兴趣与目标越相关。&#10;&#10;输出的 α_t 用于调制 AUGRU 的更新门。">
<rect x="700" y="540" width="320" height="42" rx="8" fill="#1e1410" stroke="#e8943a" stroke-width="1.5"/>
<text x="860" y="560" text-anchor="middle" fill="#e8943a" font-size="11" font-weight="600" font-family="DM Mono,monospace">Attention Score (α_t)</text>
<text x="860" y="577" text-anchor="middle" fill="#a07020" font-size="9" font-family="DM Mono,monospace" opacity=".7">α_t = softmax( score(h_t, e_target) )</text>
</g>

<!-- α_t labels near AUGRU cells -->
<text x="155" y="565" text-anchor="middle" fill="#e8943a" font-size="9" font-weight="600" font-family="DM Mono,monospace" opacity=".7">α_{t-2}</text>
<text x="305" y="565" text-anchor="middle" fill="#e8943a" font-size="9" font-weight="600" font-family="DM Mono,monospace" opacity=".7">α_{t-1}</text>
<text x="455" y="565" text-anchor="middle" fill="#e8943a" font-size="9" font-weight="600" font-family="DM Mono,monospace" opacity=".7">α_t</text>

<!-- ═══════ INTEREST EVOLVING (AUGRU) ═══════ -->

<g class="nd" data-tip="AUGRU (Attentional Update Gate GRU):&#10;在标准 GRU 基础上，用注意力权重 α_t 调制更新门:&#10;&#10;  ũ_t = α_t ⊙ u_t&#10;  h'_t = (1-ũ_t)⊙h'_{t-1} + ũ_t⊙h̃'_t&#10;&#10;效果: 与目标相关的兴趣获得更强更新，&#10;不相关的兴趣被保留但衰减。">
<rect x="100" y="595" width="110" height="40" rx="7" fill="#0d1820" stroke="#4da6ff" stroke-width="1.4"/>
<text x="155" y="620" text-anchor="middle" fill="#4da6ff" font-size="11" font-weight="600" font-family="DM Mono,monospace">AUGRU</text>
</g>
<g class="nd" data-tip="AUGRU 单元 (t-1): 接收 h_{t-1}、h'_{t-2} 和 α_{t-1}。&#10;输出演化兴趣状态 h'_{t-1}。">
<rect x="250" y="595" width="110" height="40" rx="7" fill="#0d1820" stroke="#4da6ff" stroke-width="1.4"/>
<text x="305" y="620" text-anchor="middle" fill="#4da6ff" font-size="11" font-weight="600" font-family="DM Mono,monospace">AUGRU</text>
</g>
<g class="nd" data-tip="AUGRU 最后一步: 输出最终演化兴趣 h'_T。&#10;h'_T 综合了整个用户兴趣随目标物品的演化过程。&#10;维度: (batch, hidden_dim)">
<rect x="400" y="595" width="110" height="40" rx="7" fill="#0d1820" stroke="#4da6ff" stroke-width="1.4"/>
<text x="455" y="620" text-anchor="middle" fill="#4da6ff" font-size="11" font-weight="600" font-family="DM Mono,monospace">AUGRU</text>
</g>

<!-- AUGRU sequential arrows -->
<text x="223" y="621" fill="#4da6ff" font-size="13" font-family="DM Mono,monospace" opacity=".5">→</text>
<text x="373" y="621" fill="#4da6ff" font-size="13" font-family="DM Mono,monospace" opacity=".5">→</text>
<text x="70" y="621" fill="#4da6ff" font-size="13" font-family="DM Mono,monospace" opacity=".3">⋯→</text>
<text x="525" y="621" fill="#4da6ff" font-size="13" font-family="DM Mono,monospace" opacity=".3">→⋯</text>

<!-- h'_T output -->
<g class="nd" data-tip="最终演化兴趣状态 h'_T。&#10;融合了与目标物品相关的兴趣演化信息，&#10;将与 target embedding 和 context 特征拼接后送入 MLP。">
<rect x="400" y="645" width="110" height="28" rx="5" fill="#0d1820" stroke="#4da6ff" stroke-width="1" stroke-opacity=".6"/>
<text x="455" y="664" text-anchor="middle" fill="#4da6ff" font-size="10" font-family="DM Mono,monospace">h'_T</text>
</g>

<!-- ═══════ MERGE (Concatenate) ═══════ -->

<g class="nd" data-tip="特征拼接层: 将四路特征合并为一个向量。&#10;&#10;concat([h'_T, e_target, user_feat, ad_feat])&#10;&#10;  h'_T      : AUGRU 输出的兴趣演化状态&#10;  e_target  : 目标物品 Embedding&#10;  user_feat : 用户画像特征&#10;  ad_feat   : 广告/上下文特征&#10;&#10;拼接后的向量维度 = hidden_dim + e + user_dim + ad_dim">
<rect x="480" y="695" width="240" height="44" rx="8" fill="#1a1808" stroke="#e0a020" stroke-width="1.5"/>
<text x="600" y="718" text-anchor="middle" fill="#e0a020" font-size="11" font-weight="600" font-family="DM Mono,monospace">Concatenate</text>
<text x="600" y="734" text-anchor="middle" fill="#a08010" font-size="9" font-family="DM Mono,monospace" opacity=".7">[h'_T ∥ e_target ∥ user ∥ ad]</text>
</g>

<!-- ═══════ MLP ═══════ -->

<g class="nd" data-tip="多层感知机 (MLP):&#10;用于学习高阶特征交互。&#10;&#10;结构:&#10;  Dense(128) → PReLU&#10;  Dense(64)  → PReLU&#10;  Dense(1)   → Sigmoid&#10;&#10;PReLU 是带泄露的 ReLU，&#10;负半轴有小梯度，避免神经元死亡。">
<rect x="480" y="780" width="240" height="36" rx="7" fill="#0d1a14" stroke="#3ddc84" stroke-width="1.4"/>
<text x="600" y="803" text-anchor="middle" fill="#3ddc84" font-size="11" font-weight="600" font-family="DM Mono,monospace">Dense(128) → PReLU</text>
</g>
<g class="nd">
<rect x="500" y="848" width="200" height="30" rx="6" fill="#0d1a14" stroke="#3ddc84" stroke-width="1.2"/>
<text x="600" y="868" text-anchor="middle" fill="#3ddc84" font-size="10" font-family="DM Mono,monospace">Dense(64) → PReLU</text>
</g>
<g class="nd">
<rect x="520" y="910" width="160" height="28" rx="6" fill="#0d1a14" stroke="#3ddc84" stroke-width="1.2"/>
<text x="600" y="929" text-anchor="middle" fill="#3ddc84" font-size="10" font-family="DM Mono,monospace">Dense(1)</text>
</g>

<!-- ═══════ OUTPUT ═══════ -->

<g class="nd" data-tip="最终预测输出:&#10;经过 Sigmoid 激活函数，&#10;输出用户点击目标物品的概率。&#10;&#10;y_pred = σ(MLP(concat(...)))&#10;&#10;值域: (0, 1)，越接近 1 表示&#10;用户越可能点击该物品。">
<rect x="520" y="960" width="160" height="38" rx="7" fill="#1a1408" stroke="#f0a050" stroke-width="1.5"/>
<text x="600" y="984" text-anchor="middle" fill="#f0a050" font-size="12" font-weight="600" font-family="DM Mono,monospace">y_pred (Sigmoid)</text>
</g>

<text x="600" y="1020" text-anchor="middle" fill="#a08040" font-size="9" font-family="DM Mono,monospace" opacity=".6">P(click) ∈ (0, 1)</text>

<!-- ═══════ LOSS FORMULA ═══════ -->

<g class="nd" data-tip="总损失函数:&#10;L = L_main + α · L_aux&#10;&#10;L_main: 主任务损失 (Binary Cross-Entropy)&#10;L_aux: 辅助损失 (兴趣提取正则化)&#10;α: 辅助损失权重系数&#10;&#10;辅助损失帮助 GRU 学到更有意义的隐状态，&#10;使兴趣提取更准确。">
<rect x="880" y="960" width="260" height="38" rx="7" fill="#1a0e14" stroke="#ff4d6a" stroke-width="1" stroke-opacity=".5"/>
<text x="1010" y="984" text-anchor="middle" fill="#ff4d6a" font-size="10" font-family="DM Mono,monospace" opacity=".7">L = BCE(y,ŷ) + α · L_aux</text>
</g>

</svg>

<!-- ============ TOOLTIP ============ -->
<div class="tip" id="tip"></div>

<script>
const tip=document.getElementById('tip');
document.querySelectorAll('[data-tip]').forEach(el=>{
  el.style.cursor='pointer';
  el.addEventListener('mouseenter',e=>{
    tip.textContent=el.getAttribute('data-tip').replace(/&#10;/g,'\n');
    tip.classList.add('show');
  });
  el.addEventListener('mousemove',e=>{
    tip.style.left=e.clientX+14+'px';
    tip.style.top=e.clientY+14+'px';
  });
  el.addEventListener('mouseleave',()=>tip.classList.remove('show'));
});
</script>
